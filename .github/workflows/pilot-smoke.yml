name: Pilot End-to-End Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  generated-plan-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.12.2'
          terraform_wrapper: false
      - name: Generate actual Terraform plans without deployment
        run: |
          python3 scripts/plan_pilot.py --output reports/pilot/baseline.json
          python3 scripts/plan_pilot.py --variables regression.tfvars.json --output reports/pilot/regression.json
      - run: docker compose up -d --build --wait
      - name: Assert baseline passes, regression fails, and fix passes
        run: python3 scripts/verify_pilot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-test-evidence
          path: |
            reports/pilot/*-review.json
            reports/pilot/*-review.md
            reports/pilot/verification.json
          retention-days: 14
      - if: always()
        run: docker compose down
